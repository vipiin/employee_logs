spring.application.name=springboot-backend

# Enable local profile by default for local development
spring.profiles.default=local

# Database Configurations (using env variables for production / Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_management_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Resilience4j RateLimiter Configurations
resilience4j.ratelimiter.instances.employeeListLimit.limit-for-period=5
resilience4j.ratelimiter.instances.employeeListLimit.limit-refresh-period=60s
resilience4j.ratelimiter.instances.employeeListLimit.timeout-duration=0s

# Kafka Bootstrap Servers (defaults to your Aiven cloud broker URL)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-3dedc901-emp-k.k.aivencloud.com:19060}

# Kafka Security & SASL Configs (defaults to Aiven SCRAM-SHA-256 SASL_SSL)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG}

# SSL Configurations (defaults to the copied PEM cert location)
spring.kafka.ssl.truststore-type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.ssl.truststore-location=${KAFKA_SSL_TRUSTSTORE_LOCATION:file:/app/aiven-kafka-ca.pem}

# Serializer & Deserializer Configs
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topic Configuration
spring.kafka.admin.auto-create=true
employee.events.topic=employee-events

# Performance & Reliability Tuning
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.max.block.ms=5000

# Kafka Consumer Configurations
spring.kafka.consumer.group-id=employee-events-group
spring.kafka.consumer.auto-offset-reset=latest
